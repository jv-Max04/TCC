# Alembic. O `[CA-10.4]` pede migracao que SOBE E DESCE sem perda em banco populado,
# e `down` escrito a mao e onde a perda entra sem nada acusar.
#
# ESTE ARQUIVO E SO-ASCII, e isso e requisito e nao estilo.
# O alembic le o proprio .ini com `encoding="locale"`, e numa console `cp932` um travessao UTF-8
# levanta `UnicodeDecodeError` ANTES de qualquer migracao correr. `PYTHONUTF8=1` e `-X utf8` nao
# ajudam: `locale.getencoding()` ignora o modo UTF-8 do Python. Medido em 28/08/2026, com Postgres
# em pe, os quatro testes de `[TO-10.5]` reprovavam na leitura deste cabecalho.
[alembic]
script_location = src/refino/persistence/migrations
prepend_sys_path = src
# A URL vem de REFINO_DB_URL, nunca daqui.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
